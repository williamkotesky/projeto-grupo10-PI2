
{% extends "base.html" %}

{% block title %}Editar moto{% endblock %}

{% block content %}
<div class="container py-4 py-md-5 pagina-formulario" style="max-width: 800px;">

    <header class="mb-4">
        <h1 class="h2 fw-bold mb-2">Editar moto</h1>
        <p class="text-secondary mb-0">
            Atualize os dados cadastrais da moto.
        </p>
    </header>

    <section class="card border-0 shadow-sm rounded-3"
             aria-labelledby="titulo-formulario">
        <div class="card-body p-3 p-md-4">

            <h2 id="titulo-formulario" class="h5 fw-bold mb-4">
                Dados cadastrais
            </h2>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                    <button class="btn btn-primary px-4" type="submit">
                        Salvar alterações
                    </button>

                    <a class="btn btn-outline-secondary px-4"
                       href="{% url 'atendimento' %}">
                        Voltar para atendimento
                    </a>
                </div>
            </form>

        </div>
    </section>

</div>
{% endblock %}
