
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Oficina MP Motos{% endblock %}</title>

    {% load static %}

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="fundo-oficina">
    <a class="visually-hidden-focusable p-2" href="#conteudo-principal">
        Pular para o conteúdo principal
    </a>

    <header>
        <nav class="navbar navbar-expand-md navbar-dark navbar-oficina">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                    Oficina MP Motos
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu-principal"
                    aria-controls="menu-principal"
                    aria-expanded="false"
                    aria-label="Abrir ou fechar o menu de navegação"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu-principal">
                    <ul class="navbar-nav ms-auto align-items-md-center">
                        {% if user.is_authenticated %}
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'atendimento' %}">
                                    Atendimento
                                </a>
                            </li>

                            <li class="nav-item">
                                <form method="post" action="{% url 'logout' %}">
                                    {% csrf_token %}
                                    <button class="btn btn-outline-light btn-sm ms-md-2 mt-2 mt-md-0"
                                            type="submit">
                                        Logout
                                    </button>
                                </form>
                            </li>
                        {% else %}
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'login' %}">
                                    Login
                                </a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="conteudo-principal" class="container py-4" tabindex="-1">
        {% block content %}
        {% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
