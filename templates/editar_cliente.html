{% extends "base.html" %}

{% block title %}Editar cliente{% endblock %}

{% block content %}

<h1>Editar cliente</h1>

<p>
    Atualize os dados cadastrais do cliente.
</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Salvar alterações
    </button>
</form>

<a href="{% url 'atendimento' %}">
    Voltar para atendimento
</a>

{% endblock %}
